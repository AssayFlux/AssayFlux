[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AssayFlux"
version = "0.1.0"
description = "The AssayFlux language core."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AssayFlux Contributors"}]
dependencies = ["lark>=1.3.1,<2", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-socket>=0.7", "ruff>=0.6", "build>=1", "mypy>=1.11", "pyright>=1.1.380", "pylint>=3.3", "twine>=5"]
# PennyLane currently requires Python 3.12+. The core remains usable on Python 3.11.
quantum = ["pennylane>=0.45; python_version >= '3.12'"]

[project.scripts]
assayflux = "assayflux.cli:main"
af = "assayflux.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["assayflux", "assayflux.*"]

[tool.setuptools.package-data]
assayflux = ["language/*.lark"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
  "src/AssayFlux Assistant",
  "src/AssayFlux Command Line Interface",
  "src/AssayFlux Code Execution Engine",
  "src/AssayFlux LinuxOS",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.11"
files = ["src/assayflux"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/assayflux/quantum.py"]

[tool.pyright]
include = ["src/assayflux"]
exclude = ["**/__pycache__", "**/tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = "none"

[tool.pylint.main]
py-version = "3.11"
ignore-paths = ["src/AssayFlux Assistant/.*", "src/AssayFlux Command Line Interface/.*"]
recursive = true

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "duplicate-code",
  # Existing core intentionally uses compact statements; Ruff provides the
  # primary formatting/lint gate while Pylint focuses on semantic diagnostics.
  "line-too-long",
  "multiple-statements",
  "import-outside-toplevel",
  "too-many-branches",
  "too-many-locals",
  "too-many-return-statements",
  "too-many-public-methods",
  "too-many-instance-attributes",
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-many-statements",
  "too-many-nested-blocks",
  "too-many-boolean-expressions",
  "consider-using-in",
  "consider-merging-isinstance",
  "unused-argument",
  "try-except-raise",
  "protected-access",
  "arguments-renamed",
]
