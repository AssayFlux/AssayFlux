name: AssayFlux Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install Runtimes and Test AssayFlux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install system language runtimes and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            php-cli \
            ruby-full \
            lua5.4 \
            perl \
            r-base \
            erlang \
            elixir \
            ghc \
            ocaml \
            gnucobol \
            nim \
            ldc \
            curl \
            unzip \
            zip

      - name: Install TypeScript
        run: npm install --global typescript

      - name: Install Kotlin compiler
        run: |
          KOTLIN_VERSION="2.2.20"
          curl -fL \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -o kotlin-compiler.zip
          sudo unzip -q -o kotlin-compiler.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
          rm kotlin-compiler.zip

      - name: Install Scala CLI
        run: |
          curl -fL \
            "https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz" \
            -o scala-cli.gz
          gunzip scala-cli.gz
          chmod +x scala-cli
          sudo mv scala-cli /usr/local/bin/scala
          scala version

      - name: Install Crystal
        run: |
          curl -fL https://crystal-lang.org/install.sh -o crystal-install.sh
          sudo bash crystal-install.sh
          crystal --version

      - name: Install Zig
        run: |
          ZIG_VERSION="0.15.2"
          curl -fL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            -o zig.tar.xz
          tar -xf zig.tar.xz
          sudo mv "zig-x86_64-linux-${ZIG_VERSION}" /opt/zig
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          rm zig.tar.xz
          zig version

      - name: Verify installed language runtimes
        run: |
          set -eux

          python --version
          node --version
          javac -version
          rustc --version
          cargo --version
          go version
          dotnet --version
          swift --version
          julia --version
          dart --version
          gcc --version
          g++ --version
          gfortran --version
          tsc --version
          kotlinc -version
          scala version
          php --version
          ruby --version
          lua -v
          perl --version
          R --version
          crystal --version
          elixir --version
          erl -eval 'halt().' -noshell
          ghc --version
          ocamlc -version
          dotnet --list-sdks
          nim --version
          ldc2 --version
          cobc --version
          zig version

      - name: Install AssayFlux
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify AssayFlux CLI
        run: assayflux --help

      - name: Test AssayFlux Hello World
        run: |
          printf 'show "Hello from AssayFlux"\n' > hello.af
          assayflux hello.af

      - name: Run automated tests
        env:
          ASSAYFLUX_REQUIRE_ALL_RUNTIMES: "1"
        run: python -m unittest discover -s tests -v