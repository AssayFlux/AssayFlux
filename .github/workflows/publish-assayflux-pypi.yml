name: Publish AssayFlux to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_target:
        description: Destination for an explicitly requested test publication
        required: true
        type: choice
        options:
          - testpypi

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AssayFlux Language Core/AssayFlux-AssayFlux
    steps:
      - name: Check out AssayFlux language core
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/AssayFlux Language Core/AssayFlux-AssayFlux
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "src/AssayFlux Language Core/AssayFlux-AssayFlux/pyproject.toml"
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests and static checks
        run: |
          python -m pytest
          python -m ruff check src/assayflux tests
          python -m mypy
          python -m pyright
          python -m pylint src/assayflux
      - name: Build source and wheel distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version v$VERSION" >&2
            exit 1
          }

  publish-pypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/assayflux/
    permissions:
      id-token: write
    steps:
      - name: Check out AssayFlux language core
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/AssayFlux Language Core/AssayFlux-AssayFlux
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build verified distributions
        working-directory: src/AssayFlux Language Core/AssayFlux-AssayFlux
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI using trusted publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
