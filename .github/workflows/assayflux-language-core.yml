name: AssayFlux Language Core

on:
  push:
    branches: [main]
    paths:
      - "src/AssayFlux Language Core/AssayFlux-AssayFlux/**"
      - ".github/workflows/assayflux-language-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/AssayFlux Language Core/AssayFlux-AssayFlux/**"
      - ".github/workflows/assayflux-language-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AssayFlux Language Core/AssayFlux-AssayFlux
    steps:
      - name: Check out AssayFlux
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/AssayFlux Language Core/AssayFlux-AssayFlux
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "src/AssayFlux Language Core/AssayFlux-AssayFlux/pyproject.toml"
      - name: Install language core and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run language-core tests
        run: python -m pytest
      - name: Build and validate distributable artifacts
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Ruff lint
        run: python -m ruff check src/assayflux tests
      - name: Mypy static analysis
        run: python -m mypy
      - name: Pyright static analysis
        run: python -m pyright
      - name: Pylint static analysis
        run: python -m pylint src/assayflux
      - name: Verify assistant adapter with non-loopback sockets disabled
        run: python -m pytest tests/test_assistant.py --disable-socket --allow-hosts=127.0.0.1,localhost -q
      - name: Lint language core and tests
        run: |
          python -m ruff check \
            src/assayflux/cli.py src/assayflux/api.py \
            src/assayflux/diagnostics src/assayflux/language \
            src/assayflux/runtime/interpreter.py src/assayflux/runtime/python_bridge.py \
            src/assayflux/execution \
            src/assayflux/quantum.py src/assayflux/assistant.py \
            src/assayflux/security/checkpoints.py tests

  quantum-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AssayFlux Language Core/AssayFlux-AssayFlux
    steps:
      - name: Check out AssayFlux
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/AssayFlux Language Core/AssayFlux-AssayFlux
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "src/AssayFlux Language Core/AssayFlux-AssayFlux/pyproject.toml"
      - name: Install core, development tools, and optional quantum dependency
        run: python -m pip install -e ".[dev,quantum]"
      - name: Run quantum adapter validation and live simulator tests
        run: python -m pytest tests/test_quantum.py -q
