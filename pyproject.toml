[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assayflux"
version = "0.1.0"
description = "A simple programming language powered by Python"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1"
]

[project.scripts]
assayflux = "assayflux.cli:main"

[tool.setuptools.packages.find]
include = ["assayflux*"]