[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assayflux"
version = "0.1.0"
description = "A multi-domain meta-language compiler, transpiler, and runtime."
readme = "README.md"
authors = [
    { name = "AssayFlux Developer" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
assayflux = "assayflux.cli:main"

[tool.setuptools.packages.find]
include = ["assayflux", "assayflux.*"]
